<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Biểu mẫu văn bản Viện và Trung tâm</title>
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/icon-16.png" />
  <script>
    window.Office = window.Office || {};
    window.Office.initialize = function (reason) {};

    window.callRepair = function(restart) {
      var statusEl = document.getElementById('repair-status');
      if (statusEl) {
        statusEl.innerHTML = '<span style="color:#0078d4;font-weight:600;">⏳ Đang gửi lệnh sửa lỗi... ' +
          (restart ? 'Word sẽ đóng và tự mở lại sau 2 giây!' : 'Đang thiết lập Registry...') + '</span>';
      }

      var qs = '?restart=' + (restart ? '1' : '0') + '&t=' + (new Date().getTime());

      // Method 1: Image beacon (Không bị chặn bởi CORS hoặc IE Security Zone)
      try {
        var img1 = new Image();
        img1.src = 'https://localhost:38473/api/repair' + qs;
        var img2 = new Image();
        img2.src = 'https://127.0.0.1:38473/api/repair' + qs;
      } catch (e) {}

      // Method 2: XMLHttpRequest
      try {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', '/api/repair' + qs, true);
        xhr.onreadystatechange = function() {
          if (xhr.readyState === 4 && xhr.status === 200) {
            if (statusEl) {
              statusEl.innerHTML = '<span style="color:#107c41;font-weight:600;">✅ Đã kích hoạt WebView2 thành công!</span><br><span style="color:#333;font-size:12px;margin-top:4px;display:inline-block;">' +
                (restart ? 'Word đang tự khởi động lại...' : 'Vui lòng đóng và mở lại Word để hoàn tất.') + '</span>';
            }
          }
        };
        xhr.send();
      } catch (e) {}
    };

    window.onerror = function(msg, url, line, col, error) {
      var el = document.getElementById('loading-status');
      if (el) {
        var isTrident = /Trident|MSIE/.test(navigator.userAgent);
        var extra = '';
        if (isTrident) {
          extra = '<div style="margin-top:14px;padding:12px;background:#f0f6ff;border:1px solid #c7e0f4;border-radius:6px;color:#004578;font-size:12px;text-align:left;">' +
            '<div style="font-weight:600;margin-bottom:6px;font-size:13px;color:#005a9e;">⚙️ Phát hiện Word đang chạy chế độ Internet Explorer cũ</div>' +
            '<div style="margin-bottom:10px;color:#333;line-height:1.4;">Bấm nút bên dưới để tự động kích hoạt Edge WebView2 cho Word:</div>' +
            '<div id="repair-status" style="margin-bottom:12px;min-height:20px;"></div>' +
            '<div style="margin-bottom:10px;">' +
            '  <button type="button" onclick="window.callRepair(true)" style="background:#107c41;color:#fff;border:none;padding:9px 15px;border-radius:4px;font-size:13px;font-weight:600;cursor:pointer;margin-right:8px;margin-bottom:8px;">🔄 Tự Động Sửa & Khởi Động Lại Word</button>' +
            '  <button type="button" onclick="window.callRepair(false)" style="background:#0078d4;color:#fff;border:none;padding:9px 15px;border-radius:4px;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:8px;">🛠 Chỉ Kích Hoạt WebView2</button>' +
            '</div>' +
            '<div style="font-size:11px;color:#666;border-top:1px solid #d2e3f8;padding-top:8px;">' +
            '  Hoặc chạy công cụ sửa lỗi thủ công:<br>' +
            '  <code>%LOCALAPPDATA%\\TVCIWordTools\\repair.cmd</code>' +
            '</div>' +
            '</div>';
        } else {
          extra = '<div style="font-size:11px;color:#888;margin-top:6px;">' + (url ? url.split('/').pop() : '') + ':' + line + ':' + col + '</div>';
        }
        el.innerHTML = '<span style="color:#d13438;font-weight:600;">Lỗi: ' + msg + '</span>' + extra;
      }
      return false;
    };
  </script>
  <script src="/assets/office-js/office.js"></script>
</head>
<body style="margin: 0; padding: 0; background: #faf9f8;">
  <div id="root">
    <div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; padding: 40px 20px; text-align: center; color: #323130;">
      <div style="width: 40px; height: 40px; margin: 0 auto 16px; border: 3px solid #e1dfdd; border-top-color: #0078d4; border-radius: 50%; animation: tvci-spin 1s linear infinite;"></div>
      <div style="font-size: 16px; font-weight: 600; margin-bottom: 6px; color: #0078d4;">TVCI Word Tools</div>
      <div style="font-size: 13px; color: #605e5c;" id="loading-status">Đang khởi tạo Add-in...</div>
    </div>
    <style>
      @keyframes tvci-spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
  </div>
</body>
</html>
